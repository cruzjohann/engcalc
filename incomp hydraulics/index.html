<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Hydraulics Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: palette | drawing canvas (results drawer under it) | properties panel */
  --bg:#eef1f4;
  --surface:#ffffff;
  --ink:#16212c;
  --muted:#5b6b7a;
  --line:#cfd7df;
  --accent:#0b6e99;
  --accent-soft:#dcedf5;
  --grid:#dde3e9;
  --ok:#1f7a4d; --warn:#a86400; --bad:#b3261e;
  --warn-soft:#fff1d9; --bad-soft:#fde4e2;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#17202a; --ink:#e3e9ef; --muted:#93a3b2; --line:#2c3a47;
    --accent:#4fb3de; --accent-soft:#16384a; --grid:#1c2732;
    --ok:#5cc28f; --warn:#e7a947; --bad:#f2847b; --warn-soft:#3a2c12; --bad-soft:#3d1b19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e3e9ef; --muted:#93a3b2; --line:#2c3a47;
  --accent:#4fb3de; --accent-soft:#16384a; --grid:#1c2732;
  --ok:#5cc28f; --warn:#e7a947; --bad:#f2847b; --warn-soft:#3a2c12; --bad-soft:#3d1b19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12px}
.tb{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

.main{display:grid;grid-template-columns:196px minmax(0,1fr) 320px;min-height:0}
.palette{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 20px}
.palette h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 4px 6px;font-weight:600}
.palette h2:first-child{margin-top:2px}
.pitem{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;border:1px solid transparent;cursor:grab;user-select:none;touch-action:none;font-size:13px}
.pitem:hover{background:var(--accent-soft);border-color:var(--line)}
.pitem svg{flex:none}
.hint{font-size:12px;color:var(--muted);margin:14px 4px 0}

.center{display:grid;grid-template-rows:1fr auto;min-width:0;min-height:0}
.canvas-wrap{position:relative;min-height:0;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none;background:var(--bg);cursor:default}
#cv.panning{cursor:grabbing}
.zoombar{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.zoombar .btn{padding:3px 9px;background:var(--surface)}
.chips{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent;cursor:pointer}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent;cursor:pointer}

/* svg */
.gridline{stroke:var(--grid);stroke-width:1}
.node .nbody{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node.sel .nbody{stroke:var(--accent);stroke-width:2}
.node .stripe{fill:transparent}
.node.w .stripe{fill:var(--warn)} .node.e .stripe{fill:var(--bad)}
.node text{fill:var(--ink);font-family:var(--font-body)}
.node .nname{font-size:12.5px;font-weight:600}
.node .nsub{font-size:11px;fill:var(--muted)}
.node .nres{font-size:11px;font-family:var(--font-mono);fill:var(--accent)}
.node{cursor:move}
.sym{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.sym .fill{fill:var(--ink)}
.port{fill:var(--surface);stroke:var(--muted);stroke-width:1.4;cursor:crosshair}
.node .nrow{font-size:11.5px;fill:var(--ink)}
.node .nrowv{font-size:11px;font-family:var(--font-mono);fill:var(--accent)}
.node .nrowv.back{fill:var(--warn)}
#cv text{user-select:none;-webkit-user-select:none}
.node .nspare{font-size:10px;fill:var(--muted);font-style:italic}
.node .ndiv{stroke:var(--line);stroke-width:1}
.ctab{width:100%;margin:4px 0 8px}
.ctab th,.ctab td{border:none;padding:3px 4px}
.ctab th{position:static;font-weight:500}
.ctab tbody tr{cursor:default}
.ctab tbody tr:hover{background:none}
.ctab td.l{font-family:var(--font-body);font-size:12.5px;color:var(--muted)}
.ctab input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--font-mono);font-size:12.5px;text-align:right}
.ctab input:disabled{color:var(--muted);border-color:transparent}
.cplot{width:100%;height:auto;display:block;margin:6px 0 10px}
.cplot .ax{stroke:var(--line)}
.cplot .cv{stroke:var(--ink);fill:none;stroke-width:1.8}
.cplot .cv0{stroke:var(--muted);fill:none;stroke-width:1;stroke-dasharray:4 3}
.cplot .pt{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.cplot .op{fill:var(--accent)}
.cplot text{font-size:10px;fill:var(--muted);font-family:var(--font-mono)}
.cplot .opl{fill:var(--accent)}
.port.spare{fill:var(--bg);stroke-dasharray:2 2}
.fld label small{color:var(--accent);font-size:11px}
.port:hover,.port.hot{fill:var(--accent);stroke:var(--accent)}
.link path.vis{stroke:var(--muted);stroke-width:2;fill:none}
.link.sel path.vis{stroke:var(--accent);stroke-width:3}
.link path.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.link text{font-size:11px;font-family:var(--font-mono);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;fill:none}
#arrowhead path{fill:var(--muted)}

/* drawer */
.drawer{min-width:0;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;height:34vh;min-height:120px}
.drawer.collapsed{height:auto}
.drawer.collapsed .dbody{display:none}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{border:none;background:none;padding:6px 12px;border-bottom:2px solid transparent;color:var(--muted);font-size:13px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .spacer{flex:1}
.dbody{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-weight:600;color:var(--muted);font-size:11.5px;z-index:1}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px}
td.l{font-family:var(--font-body);font-size:12.5px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tr.w td:first-child{box-shadow:inset 3px 0 var(--warn)} tr.e td:first-child{box-shadow:inset 3px 0 var(--bad)}
.empty{padding:18px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:6px 0}
.checks li{padding:6px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;cursor:pointer}
.checks li:hover{background:var(--accent-soft)}
.sev{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;flex:none;align-self:flex-start}
.sev.w{background:var(--warn-soft);color:var(--warn)} .sev.e{background:var(--bad-soft);color:var(--bad)}

/* panel */
.panel{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 30px}
.panel h3{margin:0 0 2px;font-size:15px;text-wrap:balance}
.panel .kind{color:var(--muted);font-size:12px;margin-bottom:12px}
.fld{display:grid;grid-template-columns:1fr 112px 52px;align-items:center;gap:6px;margin:6px 0}
.fld.wide{grid-template-columns:1fr 170px}
.fld label{font-size:12.5px;color:var(--muted)}
.fld input,.fld select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--font-mono);font-size:12.5px}
.fld select{font-family:var(--font-body)}
.fld .u{font-size:11.5px;color:var(--muted)}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px;font-weight:600;border-top:1px solid var(--line);padding-top:12px}
.helper{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
.helper .fld{grid-template-columns:1fr 150px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:8px 0}
.panel .row{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.panel ol{padding-left:18px;margin:6px 0;font-size:12.5px;color:var(--muted)}
.panel ol li{margin:3px 0}
.frow{display:grid;grid-template-columns:1fr 60px 30px;gap:6px;align-items:center;margin:5px 0}
.frow label{font-size:12.5px;line-height:1.25}
.frow small{display:block;color:var(--muted);font-size:11.5px}
.frow input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--font-mono);font-size:12.5px}
.btn.xs{padding:2px 0;font-size:13px}
table.mini{font-size:12px;margin-top:8px}
table.mini th,table.mini td{padding:3px 4px}
table.mini th{position:static}
table.mini tbody tr{cursor:default}
.about{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:14px;line-height:1.45}
.about b{color:var(--ink)}
.msg{font-size:12px;border-radius:6px;padding:6px 8px;margin:4px 0}
.msg.w{background:var(--warn-soft);color:var(--warn)} .msg.e{background:var(--bad-soft);color:var(--bad)}

.ghost{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(760px,100%);max-height:90%;display:flex;flex-direction:column}
.mbox header{border-radius:10px 10px 0 0}
.mbox .mb{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.mbox textarea{width:100%;min-height:240px;font-family:var(--font-mono);font-size:12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);resize:vertical}

@media (max-width: 980px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .palette{display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--line);max-height:none}
  .palette h2{width:100%;margin:6px 4px 0}
  .palette .hint{display:none}
  .canvas-wrap{height:62vh}
  .panel{border-left:none;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.app{grid-template-rows:auto auto 1fr}
.runbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
.runbar label{color:var(--muted)}
.runbar select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);max-width:240px}
.runbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.runbar .chk{display:flex;align-items:center;gap:5px}
.status{margin-left:auto;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent} .status.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.drawer.stale .dbody{opacity:.45}
#cv.stale .nres{opacity:.35}
.tag rect{stroke-width:1.2} .tag text{font-size:9.5px;font-family:var(--font-mono);font-weight:500}
.tag.fx rect{fill:var(--surface);stroke:var(--muted)} .tag.fx text{fill:var(--muted)}
.tag.sv rect{fill:var(--accent);stroke:var(--accent)} .tag.sv text{fill:var(--surface)}
.fld.m{grid-template-columns:1fr 76px 88px 44px}
.fld input.solved{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.btn.xs2{padding:2px 9px;font-size:12px}
.pad{padding:8px 14px;margin:0}
.caserow{display:flex;gap:6px;align-items:center}
.caserow input{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Line Hydraulics Builder</h1>
    <span class="sub">Incompressible flow · Darcy–Colebrook friction · Hooper 2K fittings · network solve · v1.0 by Johann Cruz</span>
    <div class="tb">
      <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn danger" id="bClear">Clear</button>
      <button class="btn" id="bImport">Import</button>
      <button class="btn" id="bExport">Export</button>
    </div>
  </header>
  <div class="runbar">
    <label for="caseSel">Case</label><select id="caseSel"></select><button class="btn" id="bCases">Cases…</button>
    <span class="sep"></span>
    <button class="btn primary" id="bRun" title="Run (Ctrl+Enter)">Run</button>
    <button class="btn" id="bRunAll">Run all cases</button>
    <label class="chk" for="autoRun"><input type="checkbox" id="autoRun"> Auto-run</label>
    <span class="status" id="status" role="status">Not run yet</span>
  </div>
  <div class="main">
    <aside class="palette" id="palette" aria-label="Units"></aside>
    <div class="center">
      <div class="canvas-wrap">
        <svg id="cv" aria-label="Line diagram">
          <defs>
            <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="gridline" fill="none"/></pattern>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker>
          </defs>
          <rect id="gridbg" x="-50000" y="-50000" width="100000" height="100000" fill="url(#gridp)"/>
          <g id="vp"><g id="links"></g><g id="nodes"></g><path id="tmp" class="tmp" d=""/></g>
        </svg>
        <div class="zoombar">
          <button class="btn" id="zOut" title="Zoom out">−</button>
          <button class="btn" id="zFit" title="Fit diagram">Fit</button>
          <button class="btn" id="zIn" title="Zoom in">+</button>
        </div>
      </div>
      <section class="drawer" id="drawer">
        <div class="tabs" role="tablist">
          <button class="tab on" data-tab="lines">Line summary</button>
          <button class="tab" data-tab="elems">Element results</button>
          <button class="tab" data-tab="solved">Solved values</button>
          <button class="tab" data-tab="checks" id="tabChecks">Checks</button>
          <button class="tab" data-tab="cmp">Case comparison</button>
          <span class="spacer"></span>
          <button class="tab" id="bDrawer" title="Show or hide results">Hide results</button>
        </div>
        <div class="dbody" id="dbody"></div>
      </section>
    </div>
    <aside class="panel" id="panel" aria-label="Properties"></aside>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mbox">
    <header><h1 id="mTitle">Export</h1><div class="tb"><button class="btn" id="mClose">Close</button></div></header>
    <div class="mb" id="mBody"></div>
  </div>
</div>
<script>
/*ENGINE-START*/
const G = 9.81;
// Hooper 2K coefficients [K1, K∞] (Chem Eng 24 Aug 1981; run-through tee K∞ as corrected to 0.05).
const FIT = {
  ell90_thr:{grp:'90° elbow',  name:'Standard R/D=1, threaded', k1:800, ki:0.40},
  ell90_flg:{grp:'90° elbow',  name:'Standard R/D=1, flanged/welded', k1:800, ki:0.25},
  ell90_lr: {grp:'90° elbow',  name:'Long radius R/D=1.5', k1:800, ki:0.20},
  ell90_m1: {grp:'90° elbow',  name:'Mitred, 1 weld (90°)', k1:1000, ki:1.15},
  ell90_m2: {grp:'90° elbow',  name:'Mitred, 2 welds (45°)', k1:800, ki:0.35},
  ell90_m3: {grp:'90° elbow',  name:'Mitred, 3 welds (30°)', k1:800, ki:0.30},
  ell45_std:{grp:'45° elbow',  name:'Standard R/D=1', k1:500, ki:0.20},
  ell45_lr: {grp:'45° elbow',  name:'Long radius R/D=1.5', k1:500, ki:0.15},
  ell45_m1: {grp:'45° elbow',  name:'Mitred, 1 weld (45°)', k1:500, ki:0.25},
  ell45_m2: {grp:'45° elbow',  name:'Mitred, 2 welds (22.5°)', k1:500, ki:0.15},
  b180_thr: {grp:'180° bend',  name:'Standard R/D=1, threaded', k1:1000, ki:0.60},
  b180_flg: {grp:'180° bend',  name:'Standard R/D=1, flanged/welded', k1:1000, ki:0.35},
  b180_lr:  {grp:'180° bend',  name:'Long radius R/D=1.5', k1:1000, ki:0.30},
  teeb_thr: {grp:'Tee, flow through branch', name:'Standard, threaded', k1:500, ki:0.70},
  teeb_lrt: {grp:'Tee, flow through branch', name:'Long radius, threaded', k1:800, ki:0.40},
  teeb_flg: {grp:'Tee, flow through branch', name:'Standard, flanged/welded', k1:800, ki:0.80},
  teeb_stb: {grp:'Tee, flow through branch', name:'Stub-in branch', k1:1000, ki:1.00},
  teer_thr: {grp:'Tee, flow through run', name:'Threaded', k1:200, ki:0.10},
  teer_flg: {grp:'Tee, flow through run', name:'Flanged/welded', k1:150, ki:0.05},
  teer_stb: {grp:'Tee, flow through run', name:'Stub-in branch', k1:100, ki:0.00},
  vg_full:  {grp:'Gate / ball / plug valve', name:'Full bore, β=1.0', k1:300, ki:0.10},
  vg_09:    {grp:'Gate / ball / plug valve', name:'Reduced bore, β=0.9', k1:500, ki:0.15},
  vg_08:    {grp:'Gate / ball / plug valve', name:'Reduced bore, β=0.8', k1:1000, ki:0.25},
  vglobe:   {grp:'Globe valve', name:'Standard', k1:1500, ki:4.0},
  vglobe_y: {grp:'Globe valve', name:'Angle or Y-type', k1:1000, ki:2.0},
  vdia:     {grp:'Diaphragm valve', name:'Dam type', k1:1000, ki:2.0},
  vbfly:    {grp:'Butterfly valve', name:'Butterfly', k1:800, ki:0.25},
  chk_lift: {grp:'Check valve', name:'Lift', k1:2000, ki:10.0},
  chk_swing:{grp:'Check valve', name:'Swing', k1:1500, ki:1.50},
  chk_tilt: {grp:'Check valve', name:'Tilting disc', k1:1000, ki:0.50},
};
const MERGE = new Set(['splitter','combiner','junction']);
const ELEM = new Set(['segment','reducer','pump','cv','orifice','fixed','userk','fitting']);

function colebrook(Re, rr){
  let f = 0.25/Math.pow(Math.log10(rr/3.7 + 5.74/Math.pow(Re,0.9)),2);
  for(let i=0;i<60;i++){ const x=-2*Math.log10(rr/3.7 + 2.51/(Re*Math.sqrt(f))); const fn=1/(x*x); if(Math.abs(fn-f)<1e-14){ f=fn; break; } f=fn; }
  return f;
}
// Laminar 64/Re up to Re 1800; Colebrook–White from Re 2100 (same basis as a hand calc using the turbulent
// formula above 2100, so the transition zone is taken at the higher, conservative value); short straight ramp
// between 1800 and 2100 so the solver never meets a jump.
const RE_LAM=1800, RE_TURB=2100;
function friction(Re, rr){
  if(!(Re>0)) return 0;
  if(Re<=RE_LAM) return 64/Re;
  if(Re>=RE_TURB) return colebrook(Re, rr);
  return 64/RE_LAM + (colebrook(RE_TURB, rr) - 64/RE_LAM)*(Re-RE_LAM)/(RE_TURB-RE_LAM);
}
function exitK(Re){ if(Re<=RE_LAM) return 2; if(Re>=RE_TURB) return 1; return 2-(Re-RE_LAM)/(RE_TURB-RE_LAM); }
function hyd(Q, D, rho, mu){ // Q m3/h (>=0), D mm, rho kg/m3, mu cP
  const A = Math.PI*Math.pow(D/1000,2)/4;
  const v = Q>0 && D>0 ? Q/3600/A : 0;
  const Re = v>0 ? rho*v*(D/1000)/(mu/1000) : 0;
  return {A, v, Re, vh: rho*v*v/2};
}
// Thin sharp-edged orifice (Hooper 1988), K on pipe velocity; plate thickness t (mm) applies Hooper's thick-orifice factor.
function orificeK(b, Re, D, t){
  if(!(Re>0) || !(b>0 && b<1)) return 0;
  let K = Re<=2500 ? (2.72 + b*b*(120/Re-1))*(1-b*b)*(1/Math.pow(b,4)-1) : (2.72 - b*b*4000/Re)*(1-b*b)*(1/Math.pow(b,4)-1);
  if(t>0){
    if(t/(b*D) > 5){ // very thick plate: treat as a sudden contraction then a sudden expansion (Hooper 1988)
      const r=1/b, f1=friction(Re, 0.045/D), d=b*D, Red=Re/b, fd=friction(Red, 0.045/d);
      const Kc = Re<=2500 ? (1.2+160/Re)*(Math.pow(r,4)-1) : (0.6+0.48*f1)*r*r*(r*r-1);          // on pipe velocity
      const Ke = Red<4000 ? 2*(1-Math.pow(b,4)) : (1+0.8*fd)*Math.pow(1-b*b,2);                   // on bore velocity
      return Kc + Ke/Math.pow(b,4); }
    K *= 0.584 + 0.0936/(Math.pow(t/(b*D),1.5) + 0.225); }
  return K;
}
// Pump curve: quadratic through shutoff (0,H0), rated (Qr,Hr) and runout (Qx,Hx), per pump at 100% speed.
// Affinity laws for speed. One block is one pump; draw parallel pumps as separate blocks.
function pumpCurve(p){ const H0=+p.H0, Qr=+p.Qr, Hr=+p.Hr, Qx=+p.Qx, Hx=+p.Hx;
  const c=((Hx-H0)/Qx-(Hr-H0)/Qr)/(Qx-Qr), b=(Hr-H0)/Qr-c*Qr; return {a:H0,b,c}; }
function pumpH(p, q){ const s=(+p.speed||100)/100, k=pumpCurve(p), qp=q/s; return s*s*(k.a+k.b*qp+k.c*qp*qp); }
const IEC_MOTORS=[0.37,0.55,0.75,1.1,1.5,2.2,3,4,5.5,7.5,11,15,18.5,22,30,37,45,55,75,90,110,132,160,200,250,315,355,400,450,500,560,630,710,800,900,1000,1250,1600,2000];
const PC_WATER=22064; // kPa, critical pressure of water (IEC 60534 FF factor)
const RHO_W15=999.0;
const CV_K=10*1.1560992283536566; // Cv = 1.1561 Kv; with Q in m3/h and ΔP in kPa: Cv = 11.561·Q·√(SG/ΔP) // kg/m3, water at 15 °C: reference for valve specific gravity (ISA-75.01 / IEC 60534)
function reducerAngle(p){ return p.type==='sudden' ? 180 : p.type==='conc' ? 30 : (+p.angle||180); }
function fitK(k1, ki, Re, D){ return Re>0 ? k1/Re + ki*(1 + 25.4/D) : 0; }
function erosional(rho, C){ return C/Math.sqrt(rho*0.0624279606)*0.3048; } // API RP 14E, m/s

// Pressure change across one element, in kPa (P_in − P_out). q in m3/h (sign = direction), fv = value being found.
function elemDetail(e, q, fv){
  const n=e.n, p=n.p, rho=e.rho, mu=e.mu, sg=q<0?-1:1, Q=Math.abs(q), D=e.Din;
  const o={dPfric:0, dPfit:0, dPstat:0, dPoth:0, dPpump:0, v:0, Re:0, D};
  const hy = D>0 ? hyd(Q,D,rho,mu) : {v:0, Re:0, vh:0};
  o.v=hy.v; o.Re=hy.Re; const vh=hy.vh/1000;
  switch(n.type){
    case 'segment': {
      const eps = +p.eps>=0 ? +p.eps : 0.045;
      const f = friction(hy.Re, eps/D), Leff=(+p.L||0)*(1+(+p.allow||0)/100);
      o.f=f; o.Leff=Leff; o.dPfric = sg*f*Leff/(D/1000)*vh; o.dPstat = rho*G*(+p.dz||0)/1000;
      o.kpa100 = Leff>0 ? Math.abs(o.dPfric)/Leff*100 : 0;
      let Ks=0; o.fitRows=[];
      Object.entries(p.fits||{}).forEach(([k,c])=>{ const ft=FIT[k]; if(!ft || !(+c>0)) return; const K=fitK(ft.k1,ft.ki,hy.Re,D); Ks+=K*(+c); o.fitRows.push({k, c:+c, K, dP:sg*K*(+c)*vh}); });
      if(p.entr && p.entr!=='none' && hy.Re>0){ const K=160/hy.Re + (p.entr==='projecting'?1.0:0.5); Ks+=K; o.fitRows.push({k:'entr', c:1, K, dP:sg*K*vh}); }
      if(p.exit===true && hy.Re>0){ const K=exitK(hy.Re); Ks+=K; o.fitRows.push({k:'exit', c:1, K, dP:sg*K*vh}); }
      // a check valve shuts against reverse flow: model it as a very large K in the reverse direction
      if(q<0 && Object.entries(p.fits||{}).some(([k,c])=>/^chk/.test(k) && +c>0)){ const K=1e12; Ks+=K; o.fitRows.push({k:'chkrev', c:1, K, dP:sg*K*vh}); o.chkShut=true; }
      o.Ksum=Ks; o.dPfit=sg*Ks*vh; break; }
    case 'fitting': { const ft=FIT[p.kind]||FIT.ell90_lr; const K=fitK(ft.k1,ft.ki,hy.Re,D); const c=+p.n>=0?+p.n:1; o.K=K; o.dPfit=sg*K*c*vh; break; }
    case 'userk': { o.K=+p.K||0; o.dPfit=sg*o.K*vh; break; }
    case 'orifice': {
      if(p.spec==='find'){ o.dPfit=fv; break; }
      const b = p.spec==='bore' ? (+p.d)/D : +p.beta; o.beta=b; o.bore=b*D;
      const K=orificeK(b, hy.Re, D, +p.t||0); o.K=K; o.dPfit=sg*K*vh; break; }
    case 'reducer': { const D2=+p.D2, th=reducerAngle(p)*Math.PI/180, f1=friction(hy.Re, (e.eps>=0?e.eps:0.045)/D); let K=0;
      if(hy.Re>0 && D2<D){ const r=D/D2; K = hy.Re<=2500 ? (1.2+160/hy.Re)*(Math.pow(r,4)-1) : (0.6+0.48*f1)*r*r*(r*r-1); K *= th<Math.PI/4 ? 1.6*Math.sin(th/2) : Math.sqrt(Math.sin(th/2)); }
      else if(hy.Re>0 && D2>D){ const b=D/D2; K = hy.Re<4000 ? 2*(1-Math.pow(b,4)) : (1+0.8*f1)*Math.pow(1-b*b,2); if(th<Math.PI/4) K *= 2.6*Math.sin(th/2); }
      o.K=K; o.dPfit=sg*K*vh; break; }
    case 'cv': {
      if(p.cvMode && p.cvMode!=='fixed'){ o.dPoth=fv; o.Cv = fv>0 ? CV_K*Q*Math.sqrt((rho/RHO_W15)/fv) : null; }
      else { const Cv=+p.Cv; o.Cv=Cv; o.dPoth = Cv>0 ? sg*(rho/RHO_W15)*Math.pow(CV_K*Q/Cv,2) : 0; }
      break; }
    case 'fixed': { o.dPoth=(+p.dP||0)*q/Math.sqrt(q*q+1e-4); break; }
    case 'pump': { const H = p.hMode==='find' ? fv : p.hMode==='curve' ? pumpH(p,q) : (+p.H||0); o.H=H; o.dPpump = -rho*G*H/1000; break; }
  }
  o.h = o.dPfric + o.dPfit + o.dPstat + o.dPoth + o.dPpump;
  return o;
}

function linsolve(A, b){
  const n=b.length, M=A.map((r,i)=>[...r, b[i]]);
  let scale=0; A.forEach(r=>r.forEach(v=>{ if(Math.abs(v)>scale) scale=Math.abs(v); }));
  for(let c=0;c<n;c++){
    let pr=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[pr][c])) pr=r;
    if(Math.abs(M[pr][c]) < 1e-11*Math.max(1,scale)) return null;
    [M[c],M[pr]]=[M[pr],M[c]];
    for(let r=c+1;r<n;r++){ const f=M[r][c]/M[c][c]; if(f) for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; }
  }
  const x=new Array(n);
  for(let r=n-1;r>=0;r--){ let s=M[r][n]; for(let k=r+1;k<n;k++) s-=M[r][k]*x[k]; x[r]=s/M[r][r]; }
  return x;
}

function solve(model, set){
  set = set || {};
  const nodes=model.nodes, byId={}; nodes.forEach(n=>byId[n.id]=n);
  const links=model.links.filter(l=>byId[l.from]&&byId[l.to]&&l.from!==l.to);
  const inL={}, outL={}; nodes.forEach(n=>{inL[n.id]=[];outL[n.id]=[];});
  links.forEach(l=>{ outL[l.from].push(l); inL[l.to].push(l); });
  const checks=[], res={}; nodes.forEach(n=>res[n.id]={msgs:[]});
  const add=(sev,id,msg,act)=>{ checks.push({sev,id,msg,act}); if(id && res[id]) res[id].msgs.push({sev,msg,act}); };
  const out=(ok,status,extra)=>Object.assign({ok,status,res,lres:{},checks,lines:[],solved:[],iters:0},extra||{});
  const name=id=>byId[id]?byId[id].name:'';

  // ---- 1. connections and inputs
  if(!nodes.some(n=>n.type==='source')) add('e',null,'Add a Source.');
  nodes.forEach(n=>{
    const ni=inL[n.id].length, no=outL[n.id].length, t=n.type, p=n.p;
    if(t==='source'){ if(ni) add('e',n.id,'A Source cannot have an inlet.'); if(no!==1) add('e',n.id, no?'A Source feeds one unit. Put a Splitter after it.':'Connect this Source to a unit.');
      if(!(+p.rho>0) || !(+p.mu>0)) add('e',n.id,'Enter a density and viscosity above zero.'); }
    else if(t==='sink'){ if(no) add('e',n.id,'A Sink cannot have an outlet.'); if(ni!==1) add('e',n.id, ni?'A Sink takes one inlet. Put a Combiner before it.':'Connect a unit to this Sink.'); }
    else if(ELEM.has(t)){ if(ni!==1) add('e',n.id, ni?'More than one line enters here. Put a Combiner before it.':'Nothing is connected to this inlet.'); if(no!==1) add('e',n.id, no?'More than one line leaves here. Put a Splitter after it.':'Nothing is connected to this outlet. End the line with a Sink.'); }
    else if(t==='splitter'){ if(ni!==1) add('e',n.id, ni?'A Splitter takes one inlet.':'Nothing is connected to this inlet.'); if(no<1) add('e',n.id,'This Splitter has no outlets.'); }
    else if(t==='combiner'){ if(no!==1) add('e',n.id, no?'A Combiner has one outlet.':'Nothing is connected to this outlet.'); if(ni<1) add('e',n.id,'This Combiner has no inlets.'); }
    if(t==='segment' && !(+p.D>0)) add('e',n.id,'Enter the inside diameter.');
    if(t==='reducer' && !(+p.D2>0)) add('e',n.id,'Enter the outlet diameter.');
    if(t==='orifice' && p.spec==='beta' && !(+p.beta>0 && +p.beta<1)) add('e',n.id,'β ratio must be between 0 and 1.');
    if(t==='orifice' && p.spec==='bore' && !(+p.d>0)) add('e',n.id,'Enter the bore diameter.');
    if(t==='reducer' && p.Dmode==='override' && !(+p.D1>0)) add('e',n.id,'Enter the inlet diameter, or set Inlet ID to From pipe.');
    if(t==='cv' && (p.cvMode==='fixed'||!p.cvMode) && !(+p.Cv>0)) add('e',n.id,'Enter the valve Cv, or choose another valve mode.');
    if(t==='cv' && p.cvMode==='flow' && !isFinite(parseFloat(p.Qset))) add('e',n.id,'Enter the flow setpoint.');
    if(t==='cv' && (p.cvMode==='pdown'||p.cvMode==='pup') && !isFinite(parseFloat(p.Pset))) add('e',n.id,'Enter the pressure setpoint.');
    if(t==='pump' && p.hMode==='curve'){ const H0=+p.H0, Qr=+p.Qr, Hr=+p.Hr, Qx=+p.Qx, Hx=+p.Hx;
      if(!(Qr>0 && Qx>Qr)) add('e',n.id,'Pump curve: rated flow must be above zero and runout flow above rated flow.');
      else if(!(H0>=Hr && Hr>=Hx && Hx>=0)) add('e',n.id,'Pump curve: head must fall from shutoff to rated to runout.');
      if(!(+p.speed>0)) add('e',n.id,'Enter the pump speed in % (100 = rated speed).'); }
  });
  if(checks.some(c=>c.sev==='e')) return out(false,'Fix the errors in Checks, then run.');

  // ---- 2. pressure points: one per connection, merged across Splitters and Combiners
  const parent={}; links.forEach(l=>parent[l.id]=l.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  nodes.forEach(n=>{ if(MERGE.has(n.type)){ const ls=[...inL[n.id],...outL[n.id]]; for(let i=1;i<ls.length;i++){ const a=find(ls[0].id), b=find(ls[i].id); if(a!==b) parent[a]=b; } } });
  const pnIdx={}; let NP=0; links.forEach(l=>{ const r=find(l.id); if(!(r in pnIdx)) pnIdx[r]=NP++; });
  const pn=l=>pnIdx[find(l.id)];
  const unitPn=n=> n.type==='source' ? pn(outL[n.id][0]) : (inL[n.id][0] ? pn(inL[n.id][0]) : pn(outL[n.id][0]));

  // ---- 3. elements, boundaries, diameters
  const els=nodes.filter(n=>ELEM.has(n.type)).map(n=>({n, a:pn(inL[n.id][0]), b:pn(outL[n.id][0])}));
  const eIdx={}; els.forEach((e,i)=>eIdx[e.n.id]=i);
  const srcs=nodes.filter(n=>n.type==='source').map(n=>({n, pn:unitPn(n)}));
  const snks=nodes.filter(n=>n.type==='sink').map(n=>({n, pn:unitPn(n)}));
  const sIdx={}, wIdx={}; srcs.forEach((s,i)=>sIdx[s.n.id]=i); snks.forEach((s,i)=>wIdx[s.n.id]=i);
  const DinM={};
  function downD(n, seen){ for(const l of outL[n.id]){ const t=byId[l.to]; if(seen.has(t.id)) continue; seen.add(t.id);
      if(t.type==='segment') return +t.p.D; if(t.type==='reducer') continue; const d=downD(t,seen); if(d) return d; } return null; }
  function Din(n, seen=new Set()){
    if(n.id in DinM) return DinM[n.id]; if(seen.has(n.id)) return null; seen.add(n.id);
    let d=null;
    if(n.type==='segment') d=+n.p.D;
    else if(n.type==='reducer' && n.p.Dmode==='override' && +n.p.D1>0) d=+n.p.D1;
    else { const il=inL[n.id][0]; if(il){ const u=byId[il.from]; d = u.type==='segment'?+u.p.D : u.type==='reducer'?+u.p.D2 : (ELEM.has(u.type)||MERGE.has(u.type)) ? Din(u,seen) : null; } }
    if(!d) d=downD(n,new Set([n.id]));
    return DinM[n.id]=d;
  }
  const epsM={};
  function epsIn(n, seen=new Set()){ if(n.id in epsM) return epsM[n.id]; if(seen.has(n.id)) return null; seen.add(n.id);
    let v=null; if(n.type==='segment') v=+n.p.eps>=0?+n.p.eps:null;
    else { const il=inL[n.id][0]; if(il){ const u=byId[il.from]; if(ELEM.has(u.type)||MERGE.has(u.type)) v=epsIn(u,seen); } }
    return epsM[n.id]=v; }
  els.forEach(e=>{ e.Din=Din(e.n); e.Dout = e.n.type==='reducer' ? +e.n.p.D2 : e.Din; const ev=epsIn(e.n); e.eps = ev!=null ? ev : 0.045;
    if(!(e.Din>0) && !['pump','fixed','cv'].includes(e.n.type)) add('e',e.n.id,'No pipe diameter found. Connect a Pipe segment next to this unit.');
    if(e.n.type==='orifice' && e.n.p.spec==='bore' && e.Din>0 && !(+e.n.p.d < e.Din)) add('e',e.n.id,`The bore (${+e.n.p.d} mm) must be smaller than the pipe ID (${e.Din.toFixed(1)} mm).`);
    // diameter change straight from one unit to the next with no reducer
    const il=inL[e.n.id][0], u=il&&byId[il.from];
    if(u && (u.type==='segment'||u.type==='reducer') && e.n.type!=='reducer'){ const du = u.type==='segment'?+u.p.D : u.type==='reducer'?+u.p.D2 : Din(u);
      const dn = e.n.type==='segment' ? +e.n.p.D : null;
      if(du>0 && dn>0 && Math.abs(du-dn)>0.5) add('w',e.n.id,`The pipe changes from ${du.toFixed(1)} to ${dn.toFixed(1)} mm here with no reducer, so the size change is not counted.`,'insRed'); }
    if(e.n.type==='reducer' && e.n.p.Dmode==='override' && u && ELEM.has(u.type)){ const du = u.type==='segment'?+u.p.D : u.type==='reducer'?+u.p.D2 : Din(u);
      if(du>0 && Math.abs(du-(+e.n.p.D1))>0.5) add('w',e.n.id,`Inlet ID ${(+e.n.p.D1).toFixed(1)} mm does not match the upstream pipe (${du.toFixed(1)} mm).`); }
  });

  // ---- 4. unknowns and fixed values
  const finds=[]; els.forEach(e=>{ if((e.n.type==='pump'&&e.n.p.hMode==='find')||(e.n.type==='cv'&&e.n.p.cvMode&&e.n.p.cvMode!=='fixed')||(e.n.type==='orifice'&&e.n.p.spec==='find')){ e.fi=finds.length; finds.push(e); } });
  const NE=els.length, NS=srcs.length, NW=snks.length, NF=finds.length;
  const iE=NP, iS=NP+NE, iW=iS+NS, iF=iW+NW, N=iF+NF;
  els.forEach(e=>{ if(e.fi!=null) e.xf=iF+e.fi; });
  const specs=[];   // {i, v, comp-owner unit}
  srcs.forEach((s,i)=>{ const p=s.n.p; if(p.qMode!=='solved') specs.push({i:iS+i, v:+p.Q||0, u:s.n.id}); if(p.pMode!=='solved') specs.push({i:s.pn, v:+p.P||0, u:s.n.id, isP:true}); });
  snks.forEach((s,i)=>{ const p=s.n.p; if(p.qMode==='fixed') specs.push({i:iW+i, v:+p.Q||0, u:s.n.id}); if(p.pMode==='fixed') specs.push({i:s.pn, v:+p.P||0, u:s.n.id, isP:true}); });
  // control valve setpoints: each brings its own equation for its own unknown ΔP
  els.forEach((e,i)=>{ const p=e.n.p; if(e.n.type!=='cv') return;
    if(p.cvMode==='flow') specs.push({i:iE+i, v:parseFloat(p.Qset), u:e.n.id});
    if(p.cvMode==='pdown') specs.push({i:e.b, v:parseFloat(p.Pset), u:e.n.id, isP:true});
    if(p.cvMode==='pup') specs.push({i:e.a, v:parseFloat(p.Pset), u:e.n.id, isP:true}); });
  function linkRef(l){ const f=byId[l.from], t=byId[l.to];
    if(ELEM.has(f.type)) return iE+eIdx[f.id]; if(f.type==='source') return iS+sIdx[f.id];
    if(ELEM.has(t.type)) return iE+eIdx[t.id]; if(t.type==='sink') return iW+wIdx[t.id]; return null; }
  const splitEqs=[];
  nodes.filter(n=>n.type==='splitter' && n.p.bal!=='balanced').forEach(n=>{
    const inRef=linkRef(inL[n.id][0]); const outs=outL[n.id];
    const refs=outs.map(linkRef);
    if(inRef==null || refs.some(r=>r==null)){ add('e',n.id,'Put a Pipe segment between this Splitter and the next Splitter or Combiner, so each outlet flow can be set.'); return; }
    const val=l=>(l.split!=null && l.split!=='' && isFinite(+l.split)) ? +l.split : null;
    const given=outs.map((l,i)=>({i, v:val(l)})).filter(o=>o.v!=null), blanks=outs.map((l,i)=>i).filter(i=>val(outs[i])==null);
    const pct=n.p.mode!=='flow';
    if(pct){ const sum=given.reduce((s,o)=>s+o.v,0);
      if(!blanks.length && Math.abs(sum-100)>0.01) add('e',n.id,`Outlet shares add to ${sum.toFixed(2)}%. They must add to 100%, or leave one outlet blank.`);
      if(blanks.length && sum>100.0001) add('e',n.id,`Outlet shares add to ${sum.toFixed(2)}%, more than 100%.`); }
    let eqGiven = blanks.length ? given : given.slice(0,-1);
    eqGiven.forEach(o=>{ const r=refs[o.i]; splitEqs.push({u:n.id, f: pct ? (x=>x[r]-o.v/100*x[inRef]) : (x=>x[r]-o.v)}); });
    for(let j=1;j<blanks.length;j++){ const r0=refs[blanks[0]], rj=refs[blanks[j]]; splitEqs.push({u:n.id, f:x=>x[rj]-x[r0]}); }
    n._chk = {pct, given, blanks, refs, inRef, outs};
  });
  if(checks.some(c=>c.sev==='e')) return out(false,'Fix the errors in Checks, then run.');

  // ---- 5. count fixed values in each connected part
  const cp=Array.from({length:NP},(_,i)=>i); const cf=x=>cp[x]===x?x:(cp[x]=cf(cp[x]));
  els.forEach(e=>{ const a=cf(e.a), b=cf(e.b); if(a!==b) cp[a]=b; });

// Make every label fit its space using the width the browser actually draws, whatever font has loaded.
// Names are shortened with an ellipsis (full text on hover); numbers are made smaller first.
function fitTexts(){

  const trunc2=(el,max)=>{ const full=el.textContent; if(W(el)<=max) return; let lo=0, hi=full.length;
    while(lo<hi){ const mid=(lo+hi+1)>>1; el.textContent=full.slice(0,mid)+'…'; if(W(el)<=max) lo=mid; else hi=mid-1; }

    if(mode==='trunc') trunc2(el,max);

      ${lr?`<div class="kv"><span>Flow</span><span>${lr.Q!=null?fmt(lr.Q,3)+' m³/h':'–'}</span><span>Pressure</span><span>${fmt(lr.P,2)} kPa g</span><span>Inside diameter</span><span>${lr.D?fmt(lr.D,1)+' mm':'–'}</span></div>`:''}
      <div class="row"><button class="btn danger" id="bDel">Delete connection</button></div>`;
    $('#bDel').onclick=deleteSel; return; }
  const n=s, T=TYPES[n.type];
  let h=`<h3>${esc(n.name)}</h3><div class="kind">${T.label} · ${T.sub}</div>
    <div class="fld wide"><label for="f-name">Name</label><input id="f-name" data-k="__name" type="text" value="${esc(n.name)}" style="font-family:var(--font-body)"></div>`;
  (FIELDS[n.type]||[]).forEach(f=>{ h+=fieldHtml(n,f); });
  if(n.type==='segment'){ h+=pipeHelper(); h+=fitEditor(n); }
  if(n.type==='reducer'){ h+=pipeHelper().replace('Size from table','Outlet size from table'); }
  if(n.type==='orifice') h+=`<p class="note">Thin, sharp-edged plate (Hooper 1988). A plate thickness applies Hooper's thick-orifice factor. Find bore sizes a restriction orifice: fix a flow and a pressure elsewhere and Run returns the bore.</p>`;
  if(n.type==='splitter') h+=splitEditor(n);
  if(n.type==='splitter'||n.type==='combiner') h+=`<p class="note">No pressure drop here. Put the tee (run or branch) inside the Pipe segment on each leg.</p>`;
  if(n.type==='sink') h+=`<p class="note">The minimum pressure is only checked when Pressure is Solved. Leave it blank if there is none.</p>`;
  if(CASEF[n.type] && S.cases.length>1) h+=`<p class="note">Flow, pressure and mode values on this unit belong to the case “${esc(S.cases[S.ci].name)}”.</p>`;
  h+=`<div id="pres">${resultHtml(n)}</div>
    <div class="row"><button class="btn" id="bDup">Duplicate</button><button class="btn danger" id="bDel">Delete unit</button></div>
    <datalist id="roughlist">${ROUGH.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</datalist>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-k]').forEach(inp=>{
    inp.addEventListener('focus',()=>pushUndo(),{once:true});
    const ev = inp.tagName==='SELECT'||inp.type==='checkbox' ? 'change' : 'input';
    inp.addEventListener(ev,()=>{
      const k=inp.dataset.k; if(ev==='change') pushUndo();
      if(k==='__name'){ n.name=inp.value; el.querySelector('h3').textContent=n.name; changed(false,true); return; }
      if(inp.type==='checkbox'){ n.p[k]=inp.checked; changed(false,true); return; }
      if(inp.tagName==='SELECT'){
        if(k==='mode'){ const Qin=(R&&R.ok&&R.res[n.id]&&R.res[n.id].Q)||0;
          S.links.filter(l=>l.from===n.id&&l.split!=null&&l.split!==''&&isFinite(+l.split)).forEach(l=>{ l.split = inp.value==='flow' ? +(Qin*(+l.split)/100).toFixed(3) : (Qin>0? +((+l.split)/Qin*100).toFixed(3) : 0); }); }
        n.p[k]=inp.value;
        if(k==='fluid' && FLUIDS[inp.value].rho){ const F=FLUIDS[inp.value]; n.p.rho=F.rho; n.p.mu=F.mu; n.p.T=F.T; n.p.Pv=F.Pv; }
        if(k==='hMode' && inp.value==='curve'){ const r=R&&R.ok&&R.res[n.id]; const H=(r&&r.H>0?r.H:(+n.p.H||30)), Q=(r&&r.Q>0?r.Q:(+n.p.Qr||30));
          if(n.p.H0===''||n.p.H0==null){ n.p.H0=+(1.25*H).toFixed(1); n.p.Hr=+H.toFixed(1); n.p.Qr=+Q.toFixed(1); n.p.Qx=+(1.5*Q).toFixed(1); n.p.Hx=+(0.6*H).toFixed(1); } }
        if(k==='cvMode'){ const r=R&&R.ok&&R.res[n.id];
          if(inp.value==='flow' && (n.p.Qset===''||n.p.Qset==null) && r) n.p.Qset=+Math.abs(r.Q).toFixed(2);
          if(inp.value==='pdown' && (n.p.Pset===''||n.p.Pset==null) && r) n.p.Pset=+r.Pout.toFixed(1);
          if(inp.value==='pup' && (n.p.Pset===''||n.p.Pset==null) && r) n.p.Pset=+r.Pin.toFixed(1); }
        if(/Mode$/.test(k)){ const f=(FIELDS[n.type]||[]).find(x=>x.mkey===k); const r=R&&R.ok&&R.res[n.id]; if(f && r && r[f.solvedKey]!=null && !isSolvedMode(n,f) && (n.p[f.key]===''||n.p[f.key]==null)) n.p[f.key]=+(+r[f.solvedKey]).toFixed(3); }
        changed(true); return; }
      const v=parseFloat(inp.value);
      if(['Pmin','t','D1','Cvr','NPSHr','eff','Qr','H0','Hr','Qx','Hx','Qset','Pset'].includes(k)) n.p[k]= inp.value.trim()===''? '' : (isFinite(v)?v:'');
      else n.p[k]=isFinite(v)?v:0;
      if((k==='rho'||k==='mu'||k==='T'||k==='Pv') && n.type==='source'){ n.p.fluid='custom'; const fs=$('#f-fluid'); if(fs) fs.value='custom'; }
      changed(false,true);
    });
  });
  if(n.type==='segment'||n.type==='reducer'){ ['h-mat','h-od','h-sdr','h-dn','h-sch'].forEach(i=>$('#'+i).addEventListener('change',helperCalc)); }
  el.querySelectorAll('[data-fit]').forEach(inp=>{ inp.addEventListener('focus',()=>pushUndo(),{once:true}); inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); n.p.fits[inp.dataset.fit]=isFinite(v)&&v>=0?v:0; changed(false,true); }); });
  el.querySelectorAll('[data-rmfit]').forEach(b=>b.onclick=()=>{ pushUndo(); delete n.p.fits[b.dataset.rmfit]; changed(true); });
  const af=$('#f-addfit'); if(af) af.onchange=()=>{ if(!af.value) return; pushUndo(); n.p.fits=n.p.fits||{}; n.p.fits[af.value]=(+n.p.fits[af.value]||0)+1; const k=af.value; changed(true); const fi=$('#fit-'+k); if(fi) fi.focus(); };
  el.querySelectorAll('[data-split]').forEach(inp=>{ const l=S.links.find(x=>x.id===inp.dataset.split); inp.addEventListener('focus',()=>pushUndo(),{once:true}); inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); if(isFinite(v)) l.split=v; else delete l.split; changed(false,true); }); });
  $('#bDel').onclick=deleteSel; $('#bDup').onclick=duplicateSel; wireInsRed();
}
function wireInsRed(){ document.querySelectorAll('#panel [data-insred]').forEach(b=>b.onclick=()=>insertReducer(b.dataset.insred)); }
function updatePanelResults(){
  const n=findSel(); if(!n||sel.kind!=='node') { if(!n) return; renderPanel(); return; }
  const pr=$('#pres'); if(pr){ pr.innerHTML=resultHtml(n); wireInsRed(); }
  const r=R&&R.ok&&R.res[n.id];

  document.querySelectorAll('#panel [data-svl]').forEach(i=>{ const o=r&&r.outlets?r.outlets.find(x=>x.link===i.dataset.svl):null; i.value=o?fmt(o.Q,3):''; });

function deleteSel(){
  const s=findSel(); if(!s) return; pushUndo();
  if(sel.kind==='link') S.links=S.links.filter(l=>l!==s);
  else { const ins=S.links.filter(l=>l.to===s.id), outs=S.links.filter(l=>l.from===s.id);
    S.links=S.links.filter(l=>l.to!==s.id&&l.from!==s.id);
    if(ins.length===1&&outs.length===1&&nodeById(outs[0].to).type!=='source') S.links.push({id:uid(),from:ins[0].from,to:outs[0].to});
    S.nodes=S.nodes.filter(n=>n!==s); }
  sel=null; changed(true);
}
function duplicateSel(){ const s=findSel(); if(!s||sel.kind!=='node') return; pushUndo();
  const c=JSON.parse(JSON.stringify(s)); c.id=uid(); c.x+=30; c.y+=NH+30; c.name=s.name+' copy'; S.nodes.push(c); sel={kind:'node',id:c.id}; changed(true); }

/* ---------- results drawer ---------- */
function applySolved(i){
  const sv=R.solved[i]; const n=nodeById(sv.id); if(!n) return; pushUndo();
  if(sv.f==='Q') n.p.Q=+sv.v.toFixed(4);
  else if(sv.f==='P') n.p.P=+sv.v.toFixed(3);
  else if(sv.f==='H') n.p.H=+sv.v.toFixed(3);
  else if(sv.f==='Cv') n.p.Cv=+sv.v.toFixed(3);
  else if(sv.f==='bore') n.p.d=+sv.v.toFixed(2);
  else if(sv.f==='split'){ const l=S.links.find(x=>x.id===sv.link); if(l){ l.split=+sv.v.toFixed(4); n.p.mode='flow'; } }
  sv.applied=true; save(); renderDrawer(); if(sel&&sel.kind==='node'&&sel.id===n.id) renderPanel();
}
function renderDrawer(){
  const el=$('#dbody'); $('#drawer').classList.toggle('stale', stale && tab!=='checks');
  const T=t=>{ document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab)); };
  T();
  if(tab==='cmp'){ renderCmp(el); return; }

    el.innerHTML=`<ul class="checks">${R.checks.slice().sort((a,b)=>a.sev===b.sev?0:a.sev==='e'?-1:1).map(c=>`<li data-node="${c.id||''}"><span class="sev ${c.sev}">${c.sev==='e'?'Error':'Warning'}</span><span><b>${esc(nm(c.id))}</b>: ${esc(c.msg)}</span></li>`).join('')}</ul>`;
  } else if(!R.ok){ el.innerHTML=`<div class="empty">${esc(R.status)} <button class="btn" id="goChecks">Show checks</button></div>`; $('#goChecks').onclick=()=>setTab('checks'); return; }
  else if(tab==='lines'){
    if(!R.lines.length){ el.innerHTML='<div class="empty">No complete line yet. Connect a Source through to a Sink.</div>'; return; }
    el.innerHTML=`<table><thead><tr><th>Line</th><th>Flow at end<br>m³/h</th><th>Pipe length<br>m</th><th>Static ΔP<br>kPa</th><th>Friction + fittings<br>kPa</th><th>Valves + fixed<br>kPa</th><th>Pump<br>kPa</th><th>Total ΔP<br>kPa</th><th>Total head<br>m</th><th>Start P<br>kPa g</th><th>End P<br>kPa g</th><th>Max velocity<br>m/s</th><th>Max gradient<br>kPa/100 m</th></tr></thead><tbody>${
      R.lines.map(l=>`<tr data-node="${l.to}"><td>${esc(nm(l.from))} → ${esc(nm(l.to))}</td><td>${fmt(l.Q,2)}</td><td>${fmt(l.L,1)}</td><td>${fmt(l.dPstat,2)}</td><td>${fmt(l.dPdyn,2)}</td><td>${fmt(l.dPoth,2)}</td><td>${l.dPpump?fmt(-l.dPpump,2):'–'}</td><td>${fmt(l.total,2)}</td><td>${fmt(l.head,2)}</td><td>${fmt(l.Pstart,2)}</td><td>${fmt(l.Pend,2)}</td><td>${fmt(l.vmax,3)}</td><td>${fmt(l.kpa100,3)}</td></tr>`).join('')}</tbody></table>`;
  } else if(tab==='elems'){
    const rows=R.order.map(id=>[nodeById(id),R.res[id]]).filter(([n,r])=>n&&r&&r.Q!=null);
    el.innerHTML=`<table><thead><tr><th>Unit</th><th class="l">Type</th><th>Flow<br>m³/h</th><th>ID<br>mm</th><th>Velocity<br>m/s</th><th>Re</th><th>f / K</th><th>Friction + fittings<br>kPa</th><th>Static<br>kPa</th><th>Pump / valve / fixed<br>kPa</th><th>Total ΔP<br>kPa</th><th>P in<br>kPa g</th><th>P out<br>kPa g</th></tr></thead><tbody>${
      rows.map(([n,r])=>`<tr class="${r.msgs.some(m=>m.sev==='e')?'e':r.msgs.length?'w':''}" data-node="${n.id}"><td>${esc(n.name)}</td><td class="l">${esc(TYPES[n.type].label)}</td><td>${fmt(r.Q,2)}</td><td>${r.D?fmt(r.D,1):'–'}</td><td>${r.v?fmt(r.v,3):'–'}</td><td>${r.Re?fmt(r.Re,0):'–'}</td><td>${r.f?fmt(r.f,4):r.K!=null?fmt(r.K,3):'–'}</td><td>${r.dP!=null?fmt((r.dPfric||0)+(r.dPfit||0),3):'–'}</td><td>${r.dP!=null?fmt(r.dPstat,2):'–'}</td><td>${r.dP!=null?fmt((r.dPoth||0)+(r.dPpump||0),2):'–'}</td><td>${r.dP!=null?fmt(r.dP,3):'–'}</td><td>${fmt(r.Pin??r.P,2)}</td><td>${fmt(r.Pout??r.P,2)}</td></tr>`).join('')}</tbody></table>`;
  } else if(tab==='solved'){
    if(!R.solved.length){ el.innerHTML='<div class="empty">Nothing was solved: every value is fixed. Set a value to Solved or Find, then run.</div>'; return; }
    el.innerHTML=`<table><thead><tr><th>Unit</th><th class="l">Value</th><th>Result</th><th class="l">Unit of measure</th></tr></thead><tbody>${
      R.solved.map((s,i)=>`<tr data-node="${s.id}"><td>${esc(nm(s.id))}</td><td class="l">${esc(s.what)}</td><td>${fmt(s.v,3)}</td><td class="l">${esc(s.u)}</td></tr>`).join('')}</tbody></table>
      <p class="note pad">Values worked out by Run. Click a row to select that unit.</p>`;
  }
  el.querySelectorAll('[data-node]').forEach(r=>r.addEventListener('click',()=>{ if(!r.dataset.node) return; sel={kind:'node',id:r.dataset.node}; renderPanel(); markSel(); centerOn(r.dataset.node); }));
}
function summarize(r){
  const o={ok:r.ok, status:r.status, nErr:r.checks.filter(c=>c.sev==='e').length, nWarn:r.checks.filter(c=>c.sev==='w').length, v:{}, vmax:0};
  if(!r.ok) return o;
  S.nodes.forEach(n=>{ const x=r.res[n.id]; if(!x) return;
    if(n.type==='source'||n.type==='sink'){ o.v[n.id+'|Q']=x.Q; o.v[n.id+'|P']=x.P; }
    if(n.type==='pump'){ o.v[n.id+'|H']=x.H; }
    if(n.type==='cv'){ o.v[n.id+'|Cv']=x.Cv; o.v[n.id+'|dP']=x.dPoth; }
    if(n.type==='segment' && x.v>o.vmax) o.vmax=x.v; });
  return o;
}
function renderCmp(el){
  if(!CMP){ el.innerHTML='<div class="empty">Press Run all cases to compare the cases side by side.</div>'; return; }
  const rows=[];
  S.nodes.forEach(n=>{
    if(n.type==='source'||n.type==='sink'){ rows.push([`${n.name} flow`,'m³/h',n.id+'|Q']); rows.push([`${n.name} pressure`,'kPa g',n.id+'|P']); }
    if(n.type==='pump') rows.push([`${n.name} head`,'m',n.id+'|H']);
    if(n.type==='cv'){ rows.push([`${n.name} Cv`,'US',n.id+'|Cv']); rows.push([`${n.name} ΔP`,'kPa',n.id+'|dP']); } });
  el.innerHTML=`${CMPstale?'<div class="msg w pad">Inputs changed since Run all cases. Run all cases again to update this table.</div>':''}
    <table><thead><tr><th>Value</th><th class="l">Unit</th>${CMP.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>
    <tr><td>Status</td><td class="l"></td>${CMP.map(c=>`<td class="l">${c.s.ok?(c.s.nErr?`${c.s.nErr} error${c.s.nErr>1?'s':''}`:'Solved')+(c.s.nWarn?`, ${c.s.nWarn} warning${c.s.nWarn>1?'s':''}`:''):esc(c.s.status)}</td>`).join('')}</tr>
    ${rows.map(([lbl,u,k])=>`<tr><td>${esc(lbl)}</td><td class="l">${u}</td>${CMP.map(c=>`<td>${c.s.ok?fmt(c.s.v[k],2):'–'}</td>`).join('')}</tr>`).join('')}
    <tr><td>Max pipe velocity</td><td class="l">m/s</td>${CMP.map(c=>`<td>${c.s.ok?fmt(c.s.vmax,3):'–'}</td>`).join('')}</tr>
    </tbody></table>`;
}
function centerOn(id){ const n=nodeById(id); if(!n) return; const r=svg.getBoundingClientRect(); view.x=r.width/2-(n.x+nodeW(n)/2)*view.k; view.y=r.height/2-(n.y+lay(n).H/2)*view.k; applyView(); }
function renderStatus(){
  const st=$('#status');
  if(!R){ st.className='status'; st.textContent='Not run yet'; }
  else if(stale){ st.className='status warn'; st.textContent='Inputs changed. Press Run.'; }
  else if(!R.ok){ st.className='status bad'; st.textContent=R.status; }
  else { const e=R.checks.filter(c=>c.sev==='e').length, w=R.checks.length-e;
    st.className='status '+(e?'bad':w?'warn':'ok'); st.textContent=R.status+(e?` · ${e} error${e>1?'s':''}`:'')+(w?` · ${w} warning${w>1?'s':''}`:''); }
  const n=R?R.checks.length:0; $('#tabChecks').textContent = n?`Checks (${n})`:'Checks';
}
function setTab(t){ tab=t; $('#drawer').classList.remove('collapsed'); $('#bDrawer').textContent='Hide results'; renderDrawer(); }

/* ---------- run ---------- */
function run(){ R=solve(S,S.set); stale=false; render(); renderDrawer(); renderStatus(); updatePanelResults(); save(); }
function changed(panelToo, keepPanel){
  if(CMP) CMPstale=true;
  if(S.auto) R=solve(S,S.set); else stale=true;
  render(); renderDrawer(); renderStatus();
  if(panelToo) renderPanel(); else if(keepPanel) updatePanelResults();
  save();
}
function runAll(){
  syncCase(); const keep=S.ci;
  CMP=S.cases.map(c=>{ loadCase(c.vals); return {name:c.name, s:summarize(solve(S,S.set))}; });
  loadCase(S.cases[keep].vals); CMPstale=false; tab='cmp'; run(); renderPanel();
}
function buildCaseSel(){ const s=$('#caseSel'); s.innerHTML=S.cases.map((c,i)=>`<option value="${i}"${i===S.ci?' selected':''}>${esc(c.name)}</option>`).join(''); $('#autoRun').checked=!!S.auto; }
function switchCase(i){ if(i===S.ci) return; syncCase(); S.ci=i; loadCase(S.cases[i].vals); buildCaseSel(); if(S.auto) R=solve(S,S.set); else stale=true; render(); renderDrawer(); renderStatus(); renderPanel(); save(); }
function openCases(){
  syncCase();
  const draw=()=>{ $('#mBody').innerHTML=`<p class="note">Geometry (pipe segments, fittings, reducers, orifices) is shared by every case. Each case keeps its own flows, pressures, Fixed/Solved/Find choices, Splitter shares, pump heads, valve Cv values and fixed ΔPs.</p>
      ${S.cases.map((c,i)=>`<div class="caserow"><input type="text" data-cname="${i}" value="${esc(c.name)}" aria-label="Case name"><button class="btn" data-cdup="${i}">Duplicate</button><button class="btn danger" data-cdel="${i}" ${S.cases.length<2?'disabled':''}>Delete</button>${i===S.ci?'<span class="note">active</span>':''}</div>`).join('')}`;
    document.querySelectorAll('[data-cname]').forEach(inp=>inp.addEventListener('input',()=>{ S.cases[+inp.dataset.cname].name=inp.value; buildCaseSel(); save(); }));
    document.querySelectorAll('[data-cdup]').forEach(b=>b.onclick=()=>{ syncCase(); pushUndo(); const c=S.cases[+b.dataset.cdup]; S.cases.splice(+b.dataset.cdup+1,0,{id:uid(), name:c.name+' copy', vals:JSON.parse(JSON.stringify(c.vals))}); if(S.ci>+b.dataset.cdup) S.ci++; buildCaseSel(); draw(); save(); });
    document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.cdel; if(S.cases.length<2) return; syncCase(); pushUndo(); S.cases.splice(i,1);
      if(i===S.ci){ S.ci=Math.max(0,i-1); loadCase(S.cases[S.ci].vals); changed(true); } else if(i<S.ci) S.ci--; CMP=null; buildCaseSel(); draw(); save(); });
  };
  modal('Cases',''); draw();
}

/* ---------- import / export ---------- */
function modal(title,html){ $('#mTitle').textContent=title; $('#mBody').innerHTML=html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
function copyFrom(id,btn){ const t=$('#'+id); t.select(); const done=()=>{ btn.textContent='Copied'; setTimeout(()=>btn.textContent='Copy',1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done,()=>{ try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent='Select and copy by hand'; } });
  else { try{ document.execCommand('copy'); done(); }catch(e){} } }
function tsv(){
  const rows=[[`Case: ${S.cases[S.ci].name}`, R&&R.ok?R.status:(R?R.status:'not run')]];
  rows.push(['Line','Flow at end m3/h','Pipe length m','Static dP kPa','Friction+fittings kPa','Valves+fixed kPa','Pump kPa','Total dP kPa','Total head m','Start P kPa g','End P kPa g','Max velocity m/s','Max gradient kPa/100m']);
  (R&&R.ok?R.lines:[]).forEach(l=>rows.push([`${nm(l.from)} -> ${nm(l.to)}`,l.Q,l.L,l.dPstat,l.dPdyn,l.dPoth,-l.dPpump,l.total,l.head,l.Pstart,l.Pend,l.vmax,l.kpa100].map(x=>typeof x==='number'?+x.toFixed(4):x)));
  rows.push([]); rows.push(['Unit','Type','Flow m3/h','ID mm','Velocity m/s','Re','f','K','Friction kPa','Fittings kPa','Static kPa','Valve/fixed kPa','Pump kPa','Total dP kPa','P in kPa g','P out kPa g']);
  (R&&R.ok?R.order:[]).forEach(id=>{ const n=nodeById(id), r=R.res[id]; if(!n||!r||r.dP==null) return;
    rows.push([n.name, TYPES[n.type].label, r.Q, r.D||'', r.v||'', r.Re||'', r.f||'', r.K??r.Ksum??'', r.dPfric, r.dPfit, r.dPstat, r.dPoth, -r.dPpump, r.dP, r.Pin, r.Pout].map(x=>typeof x==='number'?+x.toFixed(5):x)); });
  if(R&&R.ok&&R.solved.length){ rows.push([]); rows.push(['Solved values']); R.solved.forEach(s=>rows.push([nm(s.id), s.what, +(+s.v).toFixed(4), s.u])); }
  return rows.map(r=>r.join('\t')).join('\n');
}
$('#bExport').onclick=()=>{ syncCase();
  modal('Export',`<p class="note">Results are tab-separated: paste them straight into Excel. The diagram text holds every case and can be loaded back with Import.</p>
    <div style="display:flex;gap:6px;align-items:center"><button class="btn primary" id="cpT">Copy</button><span class="note">Results, active case</span></div><textarea id="tT" readonly>${esc(tsv())}</textarea>
    <div style="display:flex;gap:6px;align-items:center"><button class="btn primary" id="cpJ">Copy</button><span class="note">Diagram (JSON)</span></div><textarea id="tJ" readonly>${esc(JSON.stringify(S,null,1))}</textarea>`);
  $('#cpT').onclick=e=>copyFrom('tT',e.target); $('#cpJ').onclick=e=>copyFrom('tJ',e.target); };
$('#bImport').onclick=()=>{
  modal('Import diagram',`<p class="note">Choose a .json file saved from this app, or paste diagram text. This replaces the current diagram; Undo brings it back.</p>
    <input type="file" id="iFile" accept=".json,application/json,text/plain"><textarea id="iTxt" placeholder="Paste diagram JSON here"></textarea>
    <div style="display:flex;gap:6px;align-items:center"><button class="btn primary" id="iGo">Load diagram</button><span class="note" id="iMsg"></span></div>`);
  $('#iFile').onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(t=>$('#iTxt').value=t); };
  $('#iGo').onclick=()=>{ try{ const o=JSON.parse($('#iTxt').value); let m=o.S||o; if(!Array.isArray(m.nodes)||!Array.isArray(m.links)) throw new Error('missing nodes or links');
      m=migrate(m); m.nodes.forEach(n=>{ if(!TYPES[n.type]) throw new Error('unknown unit type '+n.type); }); normalize(m);
      m.set=Object.assign(defaultSettings(),m.set||{}); if(!Array.isArray(m.cases)||!m.cases.length){ m.cases=[{id:uid(),name:'Case 1',vals:null}]; m.ci=0; }
      pushUndo(); S=m; if(S.cases[S.ci]&&S.cases[S.ci].vals) loadCase(S.cases[S.ci].vals); sel=null; CMP=null; closeModal(); buildCaseSel(); changed(true); fit();
    }catch(err){ $('#iMsg').textContent='Could not read this text: '+err.message+'.'; } };
};
$('#mClose').onclick=()=>{ closeModal(); };
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ---------- toolbar / keys ---------- */
$('#bUndo').onclick=undo;
$('#bClear').onclick=()=>{ if(!S.nodes.length) return; pushUndo(); const keepAuto=S.auto; S=blank(); S.auto=keepAuto; sel=null; CMP=null; buildCaseSel(); changed(true); };
$('#bRun').onclick=run; $('#bRunAll').onclick=runAll; $('#bCases').onclick=openCases;
$('#caseSel').onchange=e=>switchCase(+e.target.value);
$('#autoRun').onchange=e=>{ S.auto=e.target.checked; if(S.auto) run(); else save(); };
$('#zIn').onclick=()=>zoomBy(1.2); $('#zOut').onclick=()=>zoomBy(1/1.2); $('#zFit').onclick=fit;
document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#bDrawer').onclick=()=>{ const d=$('#drawer'); d.classList.toggle('collapsed'); $('#bDrawer').textContent=d.classList.contains('collapsed')?'Show results':'Hide results'; };
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); run(); return; }
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape') closeModal();
  if(typing) return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){ e.preventDefault(); deleteSel(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); duplicateSel(); }
});

/* ---------- start ---------- */
buildPalette();
S = loadLS(); S = S ? normalize(S) : example();
S.set=Object.assign(defaultSettings(), S.set||{});
if(S.cases[S.ci]&&S.cases[S.ci].vals) loadCase(S.cases[S.ci].vals);
buildCaseSel();
R=solve(S,S.set); stale=false;
render(); renderDrawer(); renderStatus(); renderPanel();
requestAnimationFrame(fit);
// re-measure once the web fonts have loaded, since they draw at a different width from the fallback font
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>render()); }catch(e){}

</script>
</body>
</html>
